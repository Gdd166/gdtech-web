<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1a3a"/><stop offset="1" stop-color="#050b1c"/>
    </linearGradient>
    <linearGradient id="borde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="rayo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="brillo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Escudo hexagonal -->
  <path d="M256 22 L460 140 L460 372 L256 490 L52 372 L52 140 Z" fill="url(#fondo)" stroke="url(#borde)" stroke-width="22" stroke-linejoin="round"/>
  <!-- Pistas de circuito -->
  <g stroke="#22d3ee" stroke-opacity=".35" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M110 190 H150 L170 170"/><circle cx="104" cy="190" r="7" fill="#22d3ee" fill-opacity=".5"/>
    <path d="M402 322 H362 L342 342"/><circle cx="408" cy="322" r="7" fill="#22d3ee" fill-opacity=".5"/>
    <path d="M118 330 H160"/><circle cx="112" cy="330" r="7" fill="#22d3ee" fill-opacity=".5"/>
  </g>
  <!-- Letras GD -->
  <text x="256" y="318" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="190" letter-spacing="-8" fill="#ffffff">GD</text>
  <!-- Rayo -->
  <path filter="url(#brillo)" d="M292 96 L214 262 H262 L232 410 L330 220 H280 L314 96 Z" fill="url(#rayo)" stroke="#0b1a3a" stroke-width="8" stroke-linejoin="round"/>
</svg>
